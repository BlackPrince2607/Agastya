plugins {
  id("com.android.library")
  id("expo-module-gradle-plugin")
}

group = "expo.modules.playuserchoice"
version = "1.0.0"

android {
  namespace "expo.modules.playuserchoice"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Play Billing Library 8.x required by Google Play (Aug 31, 2026+); User Choice via enableUserChoiceBilling.
  implementation("com.android.billingclient:billing-ktx:8.3.0")
}
