# Railway.app deployment for the Agastya FastAPI backend.
# From repo root: railway login && railway init && railway up
# Set variables from railway.env.example in Railway Dashboard → Variables.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
watchPatterns = ["backend/**", "railway.toml", "Dockerfile"]

[deploy]
startCommand = "/bin/sh -c \"uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1\""
healthcheckPath = "/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
